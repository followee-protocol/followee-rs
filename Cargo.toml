[package]
name = "followee"
# 0.1.0 is reserved for the v0.1 completion definition in IMPLEMENTATION.md section 15.
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Non-normative Rust implementation of the Followee DID method and relay protocol"
license = "MIT"
repository = "https://github.com/followee-protocol/followee-rs"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
getrandom = "0.4"
hex = "0.4"
idna = "1"
iri-string = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
zeroize = "1"

[dev-dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
proptest = "1"
tempfile = "3"

[lints.rust]
# The crate root also carries #![forbid(unsafe_code)] as required by
# IMPLEMENTATION.md section 6.2; this table entry is defence in depth.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# IMPLEMENTATION.md section 7.3: arithmetic around timestamps, skew bounds and
# counters must be checked and must not wrap. Denying this lint crate-wide makes
# every unchecked arithmetic operator a compile failure under CI's -D warnings;
# intentional wrapping or saturating behaviour must be spelled out explicitly.
arithmetic_side_effects = "deny"
# IMPLEMENTATION.md section 6.2: the record path must reach Ed25519 only through
# crypto::verify_followee_ed25519. The banned entry points are listed in
# clippy.toml; tests/lint_guard.rs fails if that configuration is removed.
disallowed_methods = "deny"
