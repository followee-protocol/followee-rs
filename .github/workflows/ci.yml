# CI floor from IMPLEMENTATION.md section 11.7. The toolchain is pinned by
# rust-toolchain.toml; rustup resolves it automatically for every cargo call.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Doc tests
        run: cargo test --locked --doc --all-features
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit advisories
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bans, licences, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    name: Bounded fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Reduce ASLR entropy for AddressSanitizer
        # AddressSanitizer's shadow-memory mapping fails under the runner
        # kernel's default vm.mmap_rnd_bits=32; 28 is the documented fix.
        run: sudo sysctl vm.mmap_rnd_bits=28
      # The prebuilt cargo-fuzz binary is musl-linked and defaults the fuzz
      # build to its own triple, where nightly has no std and ASan cannot
      # link; pin the glibc host target explicitly.
      - name: Fuzz DID parsing
        run: cargo +nightly fuzz run did_parse --target x86_64-unknown-linux-gnu -- -max_total_time=45 -rss_limit_mb=1024
      - name: Fuzz deterministic CBOR validation
        run: cargo +nightly fuzz run cbor_validate --target x86_64-unknown-linux-gnu -- -max_total_time=45 -rss_limit_mb=1024
      - name: Fuzz record verification
        run: cargo +nightly fuzz run verify_record --target x86_64-unknown-linux-gnu -- -max_total_time=45 -rss_limit_mb=1024
