# TLS-termination snippet for the Followee demonstration handle
# authority (server-block level; certificates provisioned by the
# provider or certbot). Replace the domain and certificate paths.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    # The authority serves exactly these two path families; everything
    # else is 404 at the authority itself.
    location /.well-known/webfinger {
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host $host;
    }
    location /record/ {
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host $host;
    }
}
