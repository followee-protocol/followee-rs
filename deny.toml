# cargo-deny policy (IMPLEMENTATION.md sections 6.2 and 11.7).
# Dependency advisories, licences, duplication and sources are gated in CI.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# The allow list anticipates licences used by the planned Milestone 1+
# dependencies (RustCrypto, ed25519-dalek, SQLite bindings); entries not yet
# encountered in the graph are expected, so the unused-allowance warning is
# disabled.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
